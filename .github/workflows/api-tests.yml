name: Advanced API Automation Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # 1. Cron Schedule: Runs automatically every night at 2:00 AM UTC
  schedule:
    - cron: '0 2 * * *'
  # 2. Workflow Dispatch: Allows manual triggers directly from the GitHub UI with parameters
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Target Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - staging
          - production
      test_suite:
        description: 'Select Test Suite to Run'
        required: true
        default: 'testng.xml'
        type: choice
        options:
          - testng.xml

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Print Execution Context
        run: |
          echo "Executing against environment: ${{ github.event.inputs.environment || 'qa' }}"
          echo "Running test suite: ${{ github.event.inputs.test_suite || 'testng.xml' }}"

      - name: Run Tests with Maven
        run: mvn clean test -DsuiteXmlFile=src/test/resources/${{ github.event.inputs.test_suite || 'testng.xml' }}

      - name: Install Allure CLI Manually
        if: always()
        run: |
          sudo wget https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          sudo tar -zxvf allure-2.29.0.tgz -C /opt/
          sudo ln -s /opt/allure-2.29.0/bin/allure /usr/bin/allure
          allure --version

      - name: Generate Allure Report
        if: always()
        run: allure generate target/allure-results --clean -o target/allure-report

      - name: Upload Allure Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-${{ github.event.inputs.environment || 'qa' }}
          path: target/allure-report